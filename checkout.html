<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEEBE5">
<link rel="preconnect" href="https://api.fontshare.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<meta property="og:site_name" content="The Thrift Hub"><meta property="og:type" content="website">
<title>Checkout — The Thrift Hub</title>
</head>
<body data-page="checkout" data-nofooter="1">
<main id="coMain">
  <section class="checkout">
    <form id="coForm" novalidate>
      <p class="mono eyebrow">Secure checkout</p>
      <h1 class="display h-l" data-split="load" style="margin-top:14px">Checkout</h1>
      <p class="co-step"><small>01</small>Contact</p>
      <div class="two">
        <div class="field"><input id="fn" placeholder=" " required><label for="fn">Full name</label></div>
        <div class="field"><input id="fp" type="tel" placeholder=" " required pattern="[0-9+\s-]{10,}"><label for="fp">Phone (WhatsApp)</label></div>
      </div>
      <div class="field"><input id="fe" type="email" placeholder=" "><label for="fe">Email (optional)</label></div>
      <p class="co-step"><small>02</small>Delivery</p>
      <div class="field"><input id="fa" placeholder=" " required><label for="fa">Street address</label></div>
      <div class="two">
        <div class="field"><input id="fc" placeholder=" " required><label for="fc">City</label></div>
        <div class="field"><input id="fz" placeholder=" "><label for="fz">Postal code</label></div>
      </div>
      <p class="co-step"><small>03</small>Payment</p>
      <div class="pay">
        <label><input type="radio" name="pay" value="cod" checked> <span><b>Cash on delivery</b><br><span class="muted" style="font-size:14px">Pay when it arrives</span></span></label>
        <label><input type="radio" name="pay" value="bank"> <span><b>Bank transfer</b><br><span class="muted" style="font-size:14px">Details sent on WhatsApp</span></span></label>
        <label><input type="radio" name="pay" value="card"> <span><b>Card</b><br><span class="muted" style="font-size:14px">Visa / Mastercard</span></span></label>
      </div>
      <button class="btn full" type="submit" style="margin-top:30px;--h:60px">Place order <span class="arr">→</span></button>
      <p class="mono muted" style="margin-top:14px;text-align:center">Pieces in your bag are held for you for 15 minutes</p>
    </form>
    <aside class="co-sum" id="coSum"></aside>
  </section>
</main>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/Flip.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
