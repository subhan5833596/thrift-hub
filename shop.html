<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEEBE5">
<link rel="preconnect" href="https://api.fontshare.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<meta property="og:site_name" content="The Thrift Hub"><meta property="og:type" content="website">
<title>Shop — The Thrift Hub</title>
<meta name="description" content="Shop one-of-one thrift jackets, hoodies, tees, denim and shirts.">
</head>
<body data-page="shop">
<main>
  <header class="page-head">
    <p class="mono eyebrow" style="margin-bottom:20px">The rail · <span id="total">0</span> pieces</p>
    <h1 class="display" data-split="load">All <span class="italic">pieces</span></h1>
    <div class="sub">
      <p class="lead muted" data-reveal>Each piece is hand-picked, washed and graded A–C. Sizes are what's on the tag — check measurements on each piece.</p>
      <p class="mono muted" data-reveal>Free shipping over Rs 5,000</p>
    </div>
  </header>
  <div class="toolbar">
    <div class="filters" id="filters" role="tablist" aria-label="Filter by category"></div>
    <select class="sort" id="sort" aria-label="Sort">
      <option value="new">Newest</option>
      <option value="low">Price: low to high</option>
      <option value="high">Price: high to low</option>
      <option value="sale">On sale first</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/Flip.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
