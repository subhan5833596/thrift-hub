<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEEBE5">
<link rel="preconnect" href="https://api.fontshare.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@400;500&family=Permanent+Marker&display=swap" rel="stylesheet">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<meta property="og:site_name" content="The Thrift Hub"><meta property="og:type" content="website">
<title>Weekly Drop — The Thrift Hub</title>
<meta name="description" content="A new batch of one-of-one thrift pieces every Friday.">
</head>
<body data-page="drops">
<main>
  <section class="drops" id="drops">
    <div class="drops-bg"><div class="display" id="dWord">DROP 07</div></div>
    <div class="d-left">
      <p class="mono eyebrow">This week's drop</p>
      <h1 class="display h-m" data-split="load" style="margin-top:12px">Five pieces.<br>One chance.</h1>
    </div>
    <div id="dStage"></div>
    <div class="d-panel">
      <p class="mono muted" id="dMeta">Scroll to explore</p>
      <p class="pname" id="dName">The full drop</p>
      <p class="mono" id="dPrice" style="font-size:16px;margin-top:6px"></p>
      <div class="swatches" id="dSw" aria-label="Preview colourways"></div>
      <a class="btn" id="dBtn" href="shop.html" style="margin-top:22px">Shop the drop <span class="arr">→</span></a>
    </div>
    <div class="d-count"><span id="dIdx">00</span><small>/ 05</small></div>
  </section>

  <section class="section wrap" style="text-align:center">
    <p class="mono eyebrow" data-reveal>Next drop opens in</p>
    <div class="countdown" id="cd" style="justify-content:center;margin:30px 0">
      <div><b data-cd="d">00</b><span class="mono muted">Days</span></div>
      <div><b data-cd="h">00</b><span class="mono muted">Hours</span></div>
      <div><b data-cd="m">00</b><span class="mono muted">Mins</span></div>
      <div><b data-cd="s">00</b><span class="mono muted">Secs</span></div>
    </div>
    <p class="lead muted" style="margin:0 auto 28px" data-reveal>Every Friday, 8 PM. Join the list and get the link an hour early.</p>
    <a class="btn" href="index.html#newsForm" data-reveal>Get drop alerts <span class="arr">→</span></a>
  </section>

  <div class="marquee dark"><div class="marquee-track"><span>Drop 07</span><span>Friday 8 PM</span><span>One of one</span><span>Be quick</span></div></div>

  <section class="section">
    <div class="wrap" style="margin-bottom:10px"><h2 class="display h-l" data-split>The full<br>drop</h2></div>
    <div class="grid" id="dGrid"></div>
  </section>
</main>
<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/Flip.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
